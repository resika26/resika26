<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7f00ff"/>
      <stop offset="1" stop-color="#ff007f" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect y="1.5" width="900" height="3" rx="1.5" fill="url(#pulse)"/>
</svg>
