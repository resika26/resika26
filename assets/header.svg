<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Resika Dian Prangira - Aspiring Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b0f33"/>
    </linearGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="0.5" stop-color="#7f00ff"/>
      <stop offset="1" stop-color="#ff007f"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-450 0" to="450 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>

  <!-- floating particles -->
  <circle cx="110" cy="60" r="3" fill="#00f2fe" opacity="0.7">
    <animate attributeName="cy" values="60;48;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="80" r="2.5" fill="#ff007f" opacity="0.7">
    <animate attributeName="cy" values="80;66;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="205" r="2" fill="#7f00ff" opacity="0.7">
    <animate attributeName="cy" values="205;193;205" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="195" r="3" fill="#00f2fe" opacity="0.7">
    <animate attributeName="cy" values="195;183;195" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="38" r="2" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="450" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#neon)" filter="url(#glow)">Resika Dian Prangira</text>

  <!-- rotating subtitle -->
  <text x="225" y="168" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#00f2fe">
    &gt;
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <g font-family="'Courier New', Consolas, monospace" font-size="22" fill="#e6edf3">
    <text x="250" y="168" opacity="0">Aspiring Full-Stack Developer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="168" opacity="0">Building with TypeScript
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="168" opacity="0">Learning in public, one commit at a time
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- glowing underline -->
  <rect x="300" y="196" width="300" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="236" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="2">SURAKARTA · INDONESIA</text>
</svg>
